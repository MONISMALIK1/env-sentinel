name: Environment Sentinel

on:
  push:
    branches: [main, staging]
    paths:
      - ".env*"
      - "**/.env*"
  pull_request:
    paths:
      - ".env*"
      - "**/.env*"

jobs:
  env-check:
    name: Check env files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install env-sentinel
        run: pip install env-sentinel

      # ── Diff: verify all required keys are present ──────────────────────────
      - name: Diff .env.example vs .env.staging
        if: always()
        run: |
          env-sentinel diff .env.example .env.staging
        continue-on-error: false

      - name: Diff .env.example vs .env.production
        if: always()
        run: |
          env-sentinel diff .env.example .env.production
        continue-on-error: false

      # ── Validate: check value formats ────────────────────────────────────────
      - name: Validate .env.staging format
        if: always()
        run: env-sentinel validate .env.staging

      - name: Validate .env.production format
        if: always()
        run: env-sentinel validate .env.production

      # ── Scan: catch accidental secrets ──────────────────────────────────────
      - name: Scan .env.staging for secrets
        if: always()
        run: env-sentinel scan .env.staging

      - name: Scan .env.production for secrets
        if: always()
        run: env-sentinel scan .env.production

      # ── Full audit report (JSON artifact) ───────────────────────────────────
      - name: Full audit with JSON report
        if: always()
        run: |
          env-sentinel audit \
            --template .env.example \
            --check .env.staging \
            --check .env.production \
            --scan-secrets \
            --json-report env-sentinel-report.json || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-sentinel-report
          path: env-sentinel-report.json
          retention-days: 30
